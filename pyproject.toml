[project]
name = "istr-agent-mesh"
version = "0.1.0"
description = "FAB GERNAS AI-01 ISTR Investigation - declarative agent mesh on Microsoft Agent Framework"
requires-python = ">=3.13"
readme = "README.md"
# Runtime dependencies are pinned in requirements.txt (mirrors the reference repo).

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
